name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Runtime versions, URLs, platform strategies and SHA-256 digests live only in
# build/binary-manifest.json. The workflow intentionally has no duplicate pins.

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            pkg_target: node18-linux-x64
            helper_output: dist-helper/chibatunnel-helper

          - os: windows-latest
            platform: win
            pkg_target: node18-win-x64
            helper_output: dist-helper/chibatunnel-helper.exe

          - os: macos-latest
            platform: mac
            pkg_target: node18-macos-x64
            helper_output: dist-helper/chibatunnel-helper-mac

    runs-on: ${{ matrix.os }}
    env:
      PROJECT_WALLET_ADDRESS: ${{ secrets.PROJECT_WALLET_ADDRESS }}
      PROJECT_DONATION_MEMO: ${{ secrets.PROJECT_DONATION_MEMO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Linux build dependencies (rpm, AppImage tools, fakeroot)
      # -----------------------------------------------------------------------
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot

      - name: Materialize pinned bundled runtimes
        run: node scripts/materialize-binary-runtimes.mjs ${{ matrix.platform }}

      - name: Verify bundled runtime package inputs
        run: node scripts/materialize-binary-runtimes.mjs ${{ matrix.platform }} --verify

      # -----------------------------------------------------------------------
      # Build the privileged helper binary with pkg.
      #
      # pkg compiles chibatunnel-helper.ts (via the pre-compiled JS in dist-helper/)
      # into a self-contained native executable — no Node.js needed on the user's
      # machine. The output lands in dist-helper/ where electron-builder picks it
      # up via extraResources.
      # -----------------------------------------------------------------------
      - name: Build privileged helper (Windows)
        if: matrix.platform == 'win'
        run: npm run build:helper:win

      - name: Build privileged helper (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:helper:linux

      - name: Build privileged helper (macOS)
        if: matrix.platform == 'mac'
        run: npm run build:helper:mac

      - name: Verify helper binary
        shell: bash
        run: |
          ls -lh ${{ matrix.helper_output }} || (echo "Helper binary missing!" && exit 1)

      # -----------------------------------------------------------------------
      # Build the main Electron JS bundles (Vite / webpack / tsc, whatever
      # your existing "build" script does).
      # -----------------------------------------------------------------------
      - name: Build JS bundles
        run: npm run build

      # -----------------------------------------------------------------------
      # Package and publish.
      # electron-builder copies build/bins/<platform>/ → resources/bin/ via
      # extraResources. Runtime strategies come from the manifest; Linux system
      # dependencies such as wireguard-tools and OpenVPN are declared by the
      # electron-builder package metadata rather than copied into resources/bin.
      # -----------------------------------------------------------------------
      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --x64 --publish always
