name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Runtime versions, URLs, platform strategies and SHA-256 digests live only in
# build/binary-manifest.json. The workflow intentionally has no duplicate pins.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            pkg_target: node18-linux-x64
            helper_output: dist-helper/chibatunnel-helper
          - os: windows-latest
            platform: win
            pkg_target: node18-win-x64
            helper_output: dist-helper/chibatunnel-helper.exe
          - os: macos-latest
            platform: mac
            pkg_target: node18-macos-x64
            helper_output: dist-helper/chibatunnel-helper-mac

    runs-on: ${{ matrix.os }}
    env:
      PROJECT_WALLET_ADDRESS: ${{ secrets.PROJECT_WALLET_ADDRESS }}
      PROJECT_DONATION_MEMO: ${{ secrets.PROJECT_DONATION_MEMO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Go
        if: matrix.platform == 'linux'
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot

      - name: Materialize pinned bundled runtimes
        run: node scripts/materialize-binary-runtimes.mjs ${{ matrix.platform }}

      - name: Verify bundled runtime package inputs
        run: node scripts/materialize-binary-runtimes.mjs ${{ matrix.platform }} --verify

      - name: Build privileged helper (Windows)
        if: matrix.platform == 'win'
        run: npm run build:helper:win

      - name: Build privileged helper (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:helper:linux

      - name: Build privileged helper (macOS)
        if: matrix.platform == 'mac'
        run: npm run build:helper:mac

      - name: Verify helper binary
        shell: bash
        run: |
          ls -lh ${{ matrix.helper_output }} || (echo "Helper binary missing!" && exit 1)

      - name: Build JS bundles
        run: npm run build

      - name: Build App Packages
        run: npx electron-builder --${{ matrix.platform }} --x64 --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chibatunnel-${{ matrix.platform }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
